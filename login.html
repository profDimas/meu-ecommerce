<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Minha Loja</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { font-family: Arial, sans-serif; padding: 2rem; }
        .login-box { max-width: 320px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Entrar na Loja</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="******">
            </div>
            <button type="submit">Entrar</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('login-form');

        form.addEventListener('submit', (event) => {
            event.preventDefault(); // Não recarrega a página

            // SIMULAÇÃO DE LOGIN:
            // Salva as credenciais no localStorage (que substitui o $_SESSION do PHP)
            localStorage.setItem('user_token', 'token_ficticio_123');
            localStorage.setItem('user_name', 'João');

            // Redireciona para a Home
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
